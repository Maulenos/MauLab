name: Daily repository activity

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

concurrency:
  group: daily-repository-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Maulenos/MauLab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main branch and full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test activity generation
        run: python -m unittest discover -s tests -v
      - name: Refresh repository activity
        run: python scripts/update_activity.py
      - name: Validate documentation before publication
        run: python scripts/check_docs.py
      - name: Publish activity if changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Activity is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: refresh repository activity'
          git push origin HEAD:main
